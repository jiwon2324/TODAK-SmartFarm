# GitHub Actions CI (계획서 표 28 형상·CI). 저장소에 올린 뒤 push·PR마다 실행된다.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: todak_test
          MYSQL_USER: todak
          MYSQL_PASSWORD: ci-pass
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: 단위·통합 테스트 (JUnit 5, 실제 MySQL)
        working-directory: backend
        env: { DB_HOST: 127.0.0.1, DB_USER: todak, DB_PASSWORD: ci-pass, TZ: Asia/Seoul }
        run: ./gradlew test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-report, path: backend/build/reports/tests/test }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r simulator/requirements.txt pytest
      - run: cd simulator && python -m pytest -q tests
