server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: todak-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:todak}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:todak}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        # 테이블·컬럼 이름을 엔티티에 적은 그대로 쓴다 (Linux MySQL은 테이블 이름 대소문자 구분)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

todak:
  retention:
    raw-days: ${RAW_RETENTION_DAYS:1095}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8088}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    username: ${MQTT_USER:todak-server}
    password: ${MQTT_PASSWORD:}
    client-id: todak-backend
  control:
    rule-interval-ms: ${RULE_INTERVAL_MS:60000}
    ack-timeout-seconds: ${ACK_TIMEOUT_SEC:10}
    stale-seconds: ${STALE_SEC:180}
    alert-dedupe-minutes: 30
    manual-default-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    kr.todak: INFO
