# TODAK MQTT 브로커 (Eclipse Mosquitto 2)
# 개발·시뮬레이션(B안): 1883 평문 + 계정 인증 + ACL
# 실장비(A안) 운영: 8883 TLS 리스너를 추가하고 1883은 닫는다 (README '운영 배포' 참고)
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
